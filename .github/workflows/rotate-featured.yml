name: Rotate Hyvor Featured Posts

on:
  schedule:
    - cron: '*/5 * * * *' # every 5 minutes
  workflow_dispatch: {}   # allows manual run

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (not strictly required but handy)
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Rotate featured posts
        env:
          HYVOR_API_KEY: ${{ secrets.HYVOR_API_KEY }}
        run: |
          node rotate.js
